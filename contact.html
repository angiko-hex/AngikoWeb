    <section class="kapcsolat-section container mt-5">
      <h2 class="text-center mb-4" data-i18n="kapcsolat.h2">Megrendelés / Kapcsolat</h2>

      <form id="contactForm" class="kapcsolat-form">

        <label for="nev" data-i18n="kapcsolat.labelNev">Név</label>
        <input type="text" id="nev" class="form-control mb-3">

        <label for="email" data-i18n="kapcsolat.labelEmail">Email</label>
        <input type="email" id="email" class="form-control mb-3">

        <label for="projekt" data-i18n="kapcsolat.labelProj">Projekt típusa</label>
        <select id="projekt" class="form-select mb-3">
          <option value="">-- válassz --</option>
          <option value="Weboldal">Weboldal</option>
          <option value="Webes játék">Webes játék</option>
          <option value="Grafika / Design">Grafika / Design</option>
        </select>

        <label for="uzenet" data-i18n="kapcsolat.labelMsg">Üzenet</label>
        <textarea id="uzenet" class="form-control mb-3"></textarea>

        <div class="osszegzes p-3 mb-3">
          <strong data-i18n="kapcsolat.summLbl">Összegzés:</strong>
          <p id="summaryText" data-empty="true">Nincs kiválasztott projekt.</p>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-dark w-25" data-i18n="kapcsolat.send">Küldés</button>
        </div>

        <p id="formMessage" class="mt-3 text-center"></p>
      </form>
    </section>
