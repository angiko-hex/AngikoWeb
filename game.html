      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-center" id="menu">
        <ul class="navbar-nav menu-elvalaszto">
          <li class="nav-item"><a class="nav-link" href="about.html" data-i18n="nav.rolam">Rólam</a></li>

  <div id="game" data-world>
    <div class="score">0</div>
    <button class="btn start-screen" data-i18n="game.startBtn">Nyomj le bármilyen gombot a kezdéshez</button>
    <img id="character" alt="character">
    <img src="game_img/ground.png" alt="ground" class="ground">
    <div id="gameOver" style="display:none;">
      <h1 data-i18n="game.gameOver">JÁTÉK VÉGE!</h1>
      <p data-i18n="game.crashed">Nekimentél valaminek!</p>
      <div class="final-score"><span data-i18n="game.scoreLabel">Pontszám:</span> <span id="finalScore">0</span></div>
      <p><span data-i18n="game.distLabel">Távolság:</span> <span id="finalDistance">0</span>m</p>
      <button id="restartBtn" class="btn btn-dark" data-i18n="game.restart">Újra</button>
    </div>
  </div>

  <div id="instructions" class="pt-3 ms-5 ps-5" data-i18n="game.instrText">SZÓKÖZ vagy FEL nyíl = ugrás | Tartsd nyomva a magasabb ugráshoz</div>

  <script src="js/familiar.js"></script>
